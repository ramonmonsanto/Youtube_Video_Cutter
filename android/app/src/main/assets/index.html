<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marcador 200 puntos — pareja vs pareja</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Marcador 200">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #38bdf8;
    --win: #22c55e;
    --text: #e2e8f0;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 16px;
  }
  h1 {
    text-align: center;
    font-size: 1.4rem;
    margin: 8px 0 4px;
  }
  .meta {
    text-align: center;
    color: var(--muted);
    margin-bottom: 20px;
    font-size: 0.95rem;
  }
  .board {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    max-width: 820px;
    margin: 0 auto;
  }
  .team {
    background: var(--card);
    border-radius: 16px;
    padding: 16px;
    border: 2px solid transparent;
    transition: border-color .2s;
  }
  .team.winner {
    border-color: var(--win);
    box-shadow: 0 0 0 3px rgba(34,197,94,.25);
  }
  .team-name {
    width: 100%;
    background: transparent;
    border: none;
    color: var(--accent);
    font-size: 1.1rem;
    font-weight: 700;
    text-align: center;
    margin-bottom: 4px;
  }
  .team-name:focus { outline: 1px dashed var(--muted); border-radius: 6px; }

  /* Marcador grande de la pareja (editable directamente para corregir) */
  .team-total {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 6px;
    margin: 6px 0 12px;
  }
  .team-total input.score {
    width: 130px;
    background: transparent;
    border: none;
    border-bottom: 2px solid #334155;
    color: var(--text);
    font-size: 2.8rem;
    font-weight: 800;
    text-align: center;
    line-height: 1;
    padding: 0;
  }
  .team-total input.score:focus { outline: none; border-bottom-color: var(--accent); }
  .team-total .of { font-size: 1rem; color: var(--muted); font-weight: 500; }

  .progress {
    height: 8px;
    background: #0b1220;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 14px;
  }
  .progress > div {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width .25s;
  }
  .team.winner .progress > div { background: var(--win); }

  /* Sumar / restar los puntos de cada mano */
  .add-row {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .add-row input {
    flex: 1;
    min-width: 0;
    background: #0b1220;
    border: 1px solid #334155;
    color: var(--text);
    border-radius: 8px;
    padding: 10px;
    font-size: 1rem;
    text-align: center;
  }
  .add-row input:focus { outline: none; border-color: var(--accent); }
  .add-row button {
    border: none;
    border-radius: 8px;
    padding: 0 14px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-add { background: var(--accent); color: #0b1220; }
  .btn-sub { background: #334155; color: var(--text); }

  .players { display: flex; flex-direction: column; gap: 8px; }
  .players .name {
    background: #0b1220;
    border: 1px solid #334155;
    color: var(--text);
    border-radius: 8px;
    padding: 8px;
    font-size: 0.95rem;
  }
  .players .name:focus { outline: none; border-color: var(--accent); }

  .winner-banner {
    text-align: center;
    margin: 20px auto 0;
    max-width: 820px;
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--win);
    min-height: 1.4rem;
  }
  .controls { text-align: center; margin-top: 20px; }
  .controls button {
    background: var(--accent);
    color: #0b1220;
    border: none;
    border-radius: 10px;
    padding: 10px 20px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
  }
  @media (max-width: 560px) {
    .board { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <h1>Marcador a 200 puntos</h1>
  <p class="meta">Pareja vs pareja · gana la primera en llegar a 200</p>

  <div class="board" id="board"></div>

  <div class="winner-banner" id="banner"></div>

  <div class="controls">
    <button id="reset">Reiniciar puntos</button>
  </div>

<script>
  const META = 200;

  const teams = [
    { name: "Pareja 1", players: ["Jugador 1", "Jugador 2"] },
    { name: "Pareja 2", players: ["Jugador 3", "Jugador 4"] },
  ];

  const board = document.getElementById("board");
  const banner = document.getElementById("banner");

  teams.forEach((team, ti) => {
    const el = document.createElement("div");
    el.className = "team";
    el.dataset.team = ti;
    el.innerHTML = `
      <input class="team-name" value="${team.name}" aria-label="Nombre de la pareja">
      <div class="team-total">
        <input class="score" type="number" inputmode="numeric" value="0"
               data-team="${ti}" aria-label="Puntos de la pareja">
        <span class="of">/ ${META}</span>
      </div>
      <div class="progress"><div class="bar"></div></div>
      <div class="add-row">
        <input class="add-input" type="number" inputmode="numeric"
               placeholder="puntos de la mano" aria-label="Puntos a sumar">
        <button class="btn-add" data-team="${ti}" type="button">+ Sumar</button>
        <button class="btn-sub" data-team="${ti}" type="button">−</button>
      </div>
      <div class="players">
        ${team.players.map((p) => `
          <input class="name" value="${p}" aria-label="Nombre del jugador">
        `).join("")}
      </div>
    `;
    board.appendChild(el);
  });

  function recalc() {
    const totals = [];
    document.querySelectorAll(".team").forEach((teamEl) => {
      const total = Number(teamEl.querySelector(".score").value) || 0;
      teamEl.querySelector(".bar").style.width =
        Math.min(100, Math.max(0, (total / META) * 100)) + "%";
      totals.push(total);
    });

    // Determinar ganador
    document.querySelectorAll(".team").forEach((t) => t.classList.remove("winner"));
    const reached = totals
      .map((t, i) => ({ t, i }))
      .filter((x) => x.t >= META)
      .sort((a, b) => b.t - a.t);

    if (reached.length) {
      const top = reached[0].t;
      const winners = reached.filter((x) => x.t === top).map((x) => x.i);
      winners.forEach((i) =>
        document.querySelectorAll(".team")[i].classList.add("winner")
      );
      const names = winners
        .map((i) => document.querySelectorAll(".team-name")[i].value)
        .join(" y ");
      banner.textContent =
        winners.length > 1
          ? `¡Empate en ${top} puntos! 🏆`
          : `🏆 ¡${names} gana con ${top} puntos!`;
    } else {
      banner.textContent = "";
    }
    save();
  }

  // Sumar / restar los puntos de la mano al marcador de la pareja
  function applyRound(ti, sign) {
    const teamEl = document.querySelectorAll(".team")[ti];
    const addInput = teamEl.querySelector(".add-input");
    const scoreInput = teamEl.querySelector(".score");
    const add = Number(addInput.value);
    if (!add) return;
    scoreInput.value = (Number(scoreInput.value) || 0) + sign * add;
    addInput.value = "";
    recalc();
  }

  board.addEventListener("click", (e) => {
    if (e.target.classList.contains("btn-add"))
      applyRound(Number(e.target.dataset.team), 1);
    if (e.target.classList.contains("btn-sub"))
      applyRound(Number(e.target.dataset.team), -1);
  });

  // Enter en el campo de la mano = sumar
  board.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.classList.contains("add-input")) {
      e.preventDefault();
      applyRound(Number(e.target.dataset.team ??
        e.target.closest(".team").dataset.team), 1);
    }
  });

  // La suma se corrige automáticamente al editar el marcador o los nombres
  board.addEventListener("input", (e) => {
    if (e.target.classList.contains("add-input")) return;
    recalc();
  });

  document.getElementById("reset").addEventListener("click", () => {
    document.querySelectorAll(".score").forEach((s) => (s.value = 0));
    document.querySelectorAll(".add-input").forEach((s) => (s.value = ""));
    recalc();
  });

  function save() {
    const data = {
      teamNames: [...document.querySelectorAll(".team-name")].map((e) => e.value),
      playerNames: [...document.querySelectorAll(".name")].map((e) => e.value),
      scores: [...document.querySelectorAll(".score")].map((e) => e.value),
    };
    try { localStorage.setItem("marcador200", JSON.stringify(data)); } catch (e) {}
  }

  function load() {
    try {
      const data = JSON.parse(localStorage.getItem("marcador200"));
      if (!data) return;
      const tn = document.querySelectorAll(".team-name");
      const pn = document.querySelectorAll(".name");
      const sc = document.querySelectorAll(".score");
      data.teamNames?.forEach((v, i) => { if (tn[i]) tn[i].value = v; });
      data.playerNames?.forEach((v, i) => { if (pn[i]) pn[i].value = v; });
      data.scores?.forEach((v, i) => { if (sc[i]) sc[i].value = v; });
    } catch (e) {}
  }

  load();
  recalc();

  // Service worker: permite instalar la app y usarla sin internet
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () =>
      navigator.serviceWorker.register("./sw.js").catch(() => {})
    );
  }
</script>
</body>
</html>
