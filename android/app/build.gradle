plugins {
    id 'com.android.application'
}

android {
    namespace 'com.marcador.puntos'
    compileSdk 34

    defaultConfig {
        applicationId "com.marcador.puntos"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Firmado con la clave de debug para poder instalarlo (sideload).
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.11.0'
}
