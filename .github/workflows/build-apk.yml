name: Build APK

# Compila el APK del Marcador 200 en la nube (los runners de GitHub
# traen el Android SDK). Se puede lanzar a mano desde la pestaña Actions.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/multi-team-scoring-app-slexoi
    paths:
      - "android/**"
      - "index.html"
      - "manifest.json"
      - "sw.js"
      - "icon-*.png"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sincronizar assets web -> android
        run: |
          cp index.html manifest.json sw.js icon-192.png icon-512.png android/app/src/main/assets/

      - name: Build debug + release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Subir APK (debug)
        uses: actions/upload-artifact@v4
        with:
          name: Marcador200-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Subir APK (release, firmado con clave debug)
        uses: actions/upload-artifact@v4
        with:
          name: Marcador200-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Renombrar APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Marcador200.apk

      - name: Publicar Release con link directo al APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Marcador 200 — última versión
          body: |
            APK instalable del Apunte de Dominó (a 200 puntos).
            Descarga directa: **Marcador200.apk** (abajo en Assets).
            Al instalar, Play Protect avisará → "Instalar de todas formas" (es normal en apps fuera de la tienda).
          files: Marcador200.apk
          make_latest: true
